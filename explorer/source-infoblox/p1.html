<title>Infoblox Kentik Deployment Explorer</title>

    --net:#22d3ee; --net-fill:#08242b; --srv:#7ea8ff; --srv-fill:#0f1c34; --ext:#a3aab5; --ext-fill:#1a1d21;

*{box-sizing:border-box}

body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:rgba(0,189,77,.24)}
button{font:inherit;color:inherit}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
/* Infoblox brand bar: always black, whatever the theme */

  padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));border-bottom:2px solid var(--ib-green)}
.presets-nav{flex:1 1 auto;justify-content:center}
.brand{display:flex;align-items:center;gap:12px;min-width:0}

.chip{display:inline-flex;align-items:center;gap:6px}

.chip[aria-pressed="true"]{border-color:var(--accent)}

.dcset{display:inline-flex;align-items:stretch}
.dcset .chip{border-radius:999px 0 0 999px;padding-right:9px}
.step{display:inline-flex;align-items:center;gap:1px;border:1px solid var(--border);border-left:0;border-radius:0 999px 999px 0;background:var(--surface);padding:0 4px 0 2px}
.dcset .chip[aria-pressed="true"] + .step{border-color:var(--accent)}

.step button:hover:not(:disabled){background:var(--pill)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,27vw,410px);gap:10px}

.panel .src{font-size:12px}

.panel .linkbtn{border:0;background:none;color:var(--link);cursor:pointer;padding:0;font-size:12.5px}

.panel .tabs button[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.panel .site{border-color:var(--accent);background:var(--accent-soft)}

.panel .fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);margin:6px 0 8px}
.panel .fld input{font:inherit;font-size:13.5px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;width:100%}

svg text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--text)}

.frame{fill:var(--frame);stroke:var(--frame-stroke);stroke-width:1}

.k-chip rect.bg{fill:var(--surface);stroke:var(--border)}

.node{cursor:pointer}

.ah-https{fill:var(--l-https)} .ah-pull{fill:var(--l-pull)} .ah-flow{fill:var(--l-flow)} .ah-snmp{fill:var(--l-snmp)}
.ah-trap{fill:var(--l-trap)} .ah-syslog{fill:var(--l-syslog)} .ah-dns{fill:var(--l-dns)} .ah-synth{fill:var(--l-synth)}
.ah-ssh{fill:var(--l-ssh)} .ah-bgp{fill:var(--l-bgp)} .ah-perm{fill:var(--l-perm)} .ah-int{fill:var(--l-int)}

.e-snmp .elab text{fill:var(--l-snmp)} .e-trap .elab text{fill:var(--l-trap)} .e-syslog .elab text{fill:var(--l-syslog)}
