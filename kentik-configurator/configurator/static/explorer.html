.panel .gobtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-text);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;font-weight:500;margin:2px 6px 6px 0}
.panel .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface-2)}
/* Installed capabilities: toggles like Settings › Universal Agents */
.panel .caps .caphead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.panel .caps .caphead h4{margin:0 0 1px}
.panel .caps .caphead p{margin:0;font-size:12px}
.capn{flex:none;min-width:28px;height:28px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.caprow{display:flex;align-items:center;gap:11px;border:1px solid var(--border);border-radius:9px;padding:7px 10px;margin:0 0 6px;background:var(--surface)}
.caprow.solo{margin:4px 0 8px}
.caprow .capt{display:flex;flex-direction:column;min-width:0}
.caprow .capt b{font-size:13px;font-weight:600;line-height:1.3}
.caprow .capt span{font-size:11.5px;color:var(--muted);line-height:1.3}
.caprow .capt .aka{display:inline;font-weight:400;font-size:12px}
.caprow:not(.on) .capt b{color:var(--muted)}
.panel .card button.sw,.sw{flex:none;width:38px;height:22px;border-radius:999px;border:0;background:var(--faint);position:relative;cursor:pointer;padding:0;transition:background .15s}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.panel .card button.sw[aria-checked="true"],.sw[aria-checked="true"]{background:var(--ib-green)}
.sw[aria-checked="true"] span{left:19px}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel .card .seg button{border:0;background:transparent;padding:3px 11px;font-size:12px;border-radius:7px}
.panel .card .seg button[aria-pressed="true"]{background:var(--ib-green);color:#000}
.panel .fld .seg{align-self:flex-start}
.panel .fld select{font:inherit;font-size:13.5px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px;width:100%}
.card-ov.warn rect.bg{stroke:var(--l-trap);stroke-dasharray:4 3}
/* Save and export */
dialog.xdlg{border:1px solid var(--border);border-radius:14px;padding:0;background:var(--surface);color:var(--text);width:min(460px,calc(100vw - 32px));box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog.xdlg::backdrop{background:rgba(0,0,0,.45)}
.xdlg .xin{padding:16px 18px 18px}
.xdlg h2{font-size:17px;margin:0 0 4px}
.xdlg p{margin:0 0 10px;color:var(--muted);font-size:13px}
.xdlg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);margin:0 0 9px}
.xdlg input,.xdlg select{font:inherit;font-size:13.5px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px}
.xdlg .xbtns{display:flex;flex-direction:column;gap:7px;margin:12px 0 6px}
.xdlg .xbtns button{border:1px solid var(--border);background:var(--surface-2);border-radius:9px;padding:8px 12px;cursor:pointer;text-align:left;font-size:13.5px;font-weight:600}
.xdlg .xbtns button span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.xdlg .xbtns button.pri{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.xdlg .xbtns button:disabled{opacity:.5;cursor:default}
.xdlg .xstat{font-size:12.5px;color:var(--accent-text);min-height:18px;margin:0}
.xdlg .xclose{float:right;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:0 2px}
@media print{ .top .controls,.top .presets-nav,.picker,.legend,.panel{display:none!important} .main{grid-template-columns:1fr} }
@media (max-width:1000px){
  .app{height:auto;min-height:100vh}
  .body{flex:none}
  .main{grid-template-columns:1fr}
  .svgwrap{flex:none;aspect-ratio:1000/620;width:100%}
  .panel{overflow:visible}
}
@media (max-width:640px){
  .bdiv{display:none}
  .brand{flex-wrap:wrap;gap:4px 10px}
  .brand h1{font-size:15px}
  .shead .hint{display:none}
  .panel{padding:12px}
}
@media (prefers-reduced-motion: reduce){
  .svgwrap>svg{transition:none}
}

<p class="muted" style="font-size:12.5px">Add 20–30% headroom for bursty flow, syslog and traps.</p>

INFO.aws = {kick:'Drill-in · Public cloud', title:'AWS: flow logs to S3, read-only role',
hl:`<p class="lead">No agent in AWS. You turn on flow logs, send them to an S3 bucket you own, and create a read-only IAM role that Kentik’s collector assumes.</p>
<h3>What you set up</h3><ul>
<li>Flow logs on VPCs, Transit Gateways and Network Firewalls, written to S3 (one bucket per region)</li>
<li>An IAM role that trusts Kentik’s AWS account, protected by an ExternalId</li>
<li>A cloud export in Kentik (Settings › Public Clouds) with the role ARN and bucket</li>
<li>Many accounts? A hub role that assumes a role in each account</li></ul>
<h3>What Kentik collects</h3><ul>
<li>Flow and firewall logs</li><li>Topology metadata: VPCs, subnets, routes, security groups, gateways</li><li>CloudWatch metrics (optional)</li></ul>
<h3>Where you see it</h3><p>Kentik Map, Data Explorer, Cloud Pathfinder, Cloud Performance Monitor and alerts, next to your on-prem data.</p>
<p class="note">Kentik recommends a metadata-only export first, to prove access before turning on high-volume logs.</p>`,
dd:`<h3>Role trust policy</h3>
<pre>{
 "Effect": "Allow",
 "Principal": {
  "AWS": "arn:aws:iam::834693425129:root"
 },
 "Action": "sts:AssumeRole",
 "Condition": {
  "StringEquals": {
   "sts:ExternalId": "&lt;your Company ID&gt;"
  },
  "ArnEquals": {
   "aws:PrincipalArn":
    "arn:aws:iam::834693425129:role/eks-ingest-node"
  }
 }
}</pre>
<h3>Permissions policy</h3>
<table><thead><tr><th style="width:27%">Service</th><th>Actions</th></tr></thead><tbody>
<tr><td>EC2</td><td><code>ec2:Describe*</code> <code>ec2:Search*</code> <code>ec2:GetManagedPrefixListEntries</code></td></tr>
<tr><td>Direct Connect</td><td><code>directconnect:List*</code> <code>directconnect:Describe*</code></td></tr>
<tr><td>ELB</td><td><code>elasticloadbalancing:Describe*</code></td></tr>
<tr><td>IAM</td><td><code>iam:ListAccountAliases</code></td></tr>
<tr><td>Network Firewall</td><td><code>network-firewall:Describe*</code> <code>network-firewall:List*</code></td></tr>
<tr><td>Cloud WAN</td><td><code>networkmanager:ListCoreNetworks</code> <code>GetCoreNetwork</code> <code>GetCoreNetworkPolicy</code> <code>ListAttachments</code> <code>GetNetworkRoutes</code></td></tr>
<tr><td>CloudWatch</td><td><code>cloudwatch:ListMetrics</code> <code>GetMetricStatistics</code> <code>GetMetricData</code> <code>Describe*</code></td></tr>
<tr><td>Organizations</td><td><code>organizations:ListAccounts</code></td></tr>
<tr><td>S3 (log bucket)</td><td><code>s3:Get*</code> <code>s3:List*</code> on <code>arn:aws:s3:::&lt;bucket&gt;</code> and <code>/*</code></td></tr>
<tr><td>KMS (SSE-KMS only)</td><td><code>kms:Decrypt</code> <code>kms:DescribeKey</code> on the key</td></tr>
</tbody></table>
<h3>Flow log settings</h3><ul>
<li>Filter All, destination S3, Custom format with every v2–v5 field.</li>
<li>Regional buckets. Kentik treats each bucket as one device, so hundreds of VPCs into one global bucket risks S3 throttling.</li>
<li>SSE-S3 recommended, SSE-KMS needs the KMS statement, SSE-C is not supported.</li></ul>
<h3>Cloud export in Kentik</h3><ol style="padding-left:18px;margin:0 0 8px">
<li>Settings › Public Clouds › Create Cloud Export › AWS Cloud.</li>
<li>Features: Metadata (required), Flow logs, Firewall logs, Cloud metrics history.</li>
<li>Role ARN › Verify Role. Region › Verify Region.</li>
<li>Bucket name and prefix › Verify S3 Bucket. Nested: spoke account IDs, regions, role suffix.</li>
<li>Sampling, name, billing plan, Save.</li></ol>
<p>Or tick “Help me configure my provider via Terraform” to get a <code>main.tf</code> that can create the role, bucket and flow logs.</p>
<h3>Status and sampling</h3><ul>
<li>Export status: Start, Pending, Error, OK, Disabled or Halt.</li>
<li>Sampling: Legacy (up to 10k flows per file), a rate from 2 to 2000, or Unsampled.</li>
<li>Licensing: CloudPak, measured in flows per second.</li></ul>`,
src:[['Kentik for AWS','https://kb.kentik.com/docs/kentik-for-aws'],['Metadata Configuration (AWS)','https://kb.kentik.com/docs/metadata-configuration-aws'],['Flow/Firewall Log Collection Configuration','https://kb.kentik.com/docs/flow-firewall-log-collection-configuration'],['Kentik Export Configuration for AWS','https://kb.kentik.com/docs/kentik-export-configuration-aws'],['AWS Endpoints List','https://kb.kentik.com/docs/aws-endpoints-list'],['Public Clouds','https://kb.kentik.com/docs/public-clouds'],['Cloud Performance Monitor','https://kb.kentik.com/docs/cloud-performance-monitor']]};

INFO.azure = {kick:'Drill-in · Public cloud', title:'Azure: flow logs to a storage account',
hl:`<p class="lead">No agent in Azure. Network Watcher writes VNet flow logs to a storage account you own, and Kentik reads it through an app you approve in Entra ID.</p>
<h3>What you set up</h3><ul>
<li>VNet flow logs from Network Watcher to a dedicated storage account</li>
<li>Azure Firewall diagnostic logs to the same storage account</li>
<li>The Kentik enterprise app, or your own app registration, with read-only roles</li>
<li>A cloud export in Kentik. A generated PowerShell script can do most of the Azure side (VNet flow logs only)</li></ul>
<h3>What Kentik collects</h3><ul><li>Flow logs and firewall logs</li><li>Topology metadata</li><li>Azure metrics (optional)</li></ul>
<h3>Where you see it</h3><p>Kentik Map, Data Explorer, Cloud Pathfinder, the Cloud dashboards and alerts.</p>`,
dd:`<h3>Roles for the Kentik service principal</h3>
<table><thead><tr><th style="width:38%">Role</th><th style="width:30%">Scope</th><th>Why</th></tr></thead><tbody>
<tr><td>Reader</td><td>Subscription or RG with the logs</td><td>Read resources</td></tr>
<tr><td>Reader</td><td>Extra subscriptions or RGs</td><td>Enrichment scope</td></tr>
<tr><td>Storage Blob Data Reader (or Reader and Data Access)</td><td>Log storage account</td><td>Read exported logs</td></tr>
<tr><td>Custom read-only Kentik role (optional)</td><td>Tenant</td><td>Full traffic path views</td></tr>
</tbody></table>
<h3>Two ways to authenticate</h3><ul>
<li><b>Kentik enterprise app</b> (Kentik NSG Flow Exporter): an Application Administrator assigns it; then Validate Service Principal in the wizard.</li>
<li><b>Custom app registration</b>: single tenant, your secret or certificate, entered as a Kentik credential with the client and tenant IDs.</li></ul>
<h3>Network</h3><p>If the storage account firewall is restricted, allow <code>20.69.189.228</code> and <code>20.69.185.115</code>. WestUS2 uses <code>51.8.214.254</code> and <code>172.171.46.16</code>.</p>

<h3>Roles for Kentik’s service account</h3>
<p><code>kentik-vpc-flow@kentik-vpc-flow.iam.gserviceaccount.com</code></p>
<table><thead><tr><th style="width:36%">Role</th><th style="width:30%">Where</th><th>Why</th></tr></thead><tbody>
<tr><td>Pub/Sub Subscriber</td><td>The subscription</td><td>Pull flow log messages</td></tr>
<tr><td>Pub/Sub Viewer</td><td>The subscription</td><td>See the subscription</td></tr>
<tr><td>Compute Viewer (not Compute Network Viewer)</td><td>Project, or the top-level folder</td><td>Read topology metadata</td></tr>
</tbody></table>
<p>Whoever grants Compute Viewer needs <code>compute.networks.list</code> and <code>resourcemanager.projects.setIamPolicy</code>.</p>
<h3>Flow log settings</h3><ul>
<li>Include metadata. Kentik needs it.</li>
<li>Any aggregation interval works.</li>
<li>Sample rate 0–100%, default 50%. Check the estimated logs per day for cost.</li>
<li>To cut cost, narrow the sink filter by port, protocol or subnet.</li></ul>
<h3>Steps in the Google Cloud console</h3><ol style="padding-left:18px;margin:0 0 8px">
<li>VPC Network › subnet › Edit › Flow logs On › Configure Logs › Include metadata.</li>
<li>Logging › Logs Router › Create Sink › Cloud Pub/Sub topic › create the topic › add the filter.</li>
<li>Pub/Sub › Topics › Create Subscription › delivery type Pull.</li>
<li>Pub/Sub › Subscriptions › select it › Add Member › Kentik’s service account › Pub/Sub Subscriber and Pub/Sub Viewer.</li>
<li>IAM &amp; Admin › IAM › Grant Access › Kentik’s service account › Compute Viewer.</li></ol>
<h3>Cloud export in Kentik</h3><ol style="padding-left:18px;margin:0 0 8px">
<li>Settings › Public Clouds › Create Cloud Export › GCP Cloud.</li>
<li>Features: Metadata (required), Flow logs, Cloud Run log collection (a second export), Cloud metrics history.</li>
<li>Project ID, Pub/Sub topic and subscription name, then name, billing plan, Save.</li></ol>
<p class="note">A metadata-only export always shows a red flow status, because it has no flow data. That is expected.</p>`,

INFO.oci = {kick:'Drill-in · Public cloud', title:'Oracle Cloud: flow logs to Object Storage',
hl:`<p class="lead">No agent in OCI. OCI Logging captures VCN flow logs, Connector Hub moves them into an Object Storage bucket, and Kentik reads the bucket through OCI APIs.</p>
<h3>What you set up</h3><ul>
<li>An Object Storage bucket for the logs</li>
<li>A log group and a capture filter in the root compartment</li>
<li>VCN flow logs on the VCNs, subnets or VNICs you choose</li>
<li>A Connector Hub connector from Logging to the bucket</li>
<li>Access for Kentik: a cross-tenancy policy (recommended) or a user holding Kentik’s API key</li>
<li>A cloud export in Kentik (Settings › Public Clouds)</li></ul>
<h3>What Kentik collects</h3><ul><li>Flow logs</li><li>Topology metadata: VCNs, subnets, route tables, security lists, NSGs, gateways and DRGs</li></ul>
<h3>Where you see it</h3><p>Kentik Map and Data Explorer. The Traffic Trends and Overviews dashboards are not available for OCI.</p>`,
dd:`<h3>Two ways to give Kentik access</h3><ul>
<li><b>Cross-tenancy policy</b> (recommended): the Kentik portal generates it; paste it into the OCI manual policy editor.</li>
<li><b>Custom user</b>: a user and group with Kentik’s public key as an API key, fingerprint <code>d0:b4:75:ac:39:8a:90:b0:cf:ee:3e:ee:b9:0c:07:ff</code>, and <code>Allow group groupRef to READ all-resources in tenancy</code>.</li></ul>
<h3>Bucket policy</h3>
<pre>Allow group groupRef to READ buckets in tenancy
  WHERE target.bucket.name=&lt;bucketName&gt;
Allow group groupRef to READ objects in tenancy
  WHERE target.bucket.name=&lt;bucketName&gt;</pre>
<h3>Least-privilege option</h3><p>Instead of READ all-resources: INSPECT tenancies and metrics, plus READ on vcns, subnets, route-tables, security-lists, network-security-groups, internet-gateways, nat-gateways, drg-object, drg-attachments, drg-route-tables, drg-route-distributions, local-peering-gateways, ipsec-connections, cpes, cross-connects, virtual-circuits, capture-filters and metrics.</p>
<h3>Connector Hub</h3><ul>
<li>Source: Logging (log group and flow log). Target: Object Storage (bucket, optional object name prefix).</li>
<li>Defaults: 100 MB batch size, 7 second batch time. The connector can create its own policy.</li></ul>
<h3>Values to collect</h3>
<table><thead><tr><th style="width:44%">Value</th><th>Notes</th></tr></thead><tbody>
<tr><td>Tenancy OCID</td><td>Tenancy details</td></tr>
<tr><td>User OCID</td><td>Custom user only</td></tr>
<tr><td>Home region</td><td>The city name in parentheses</td></tr>
<tr><td>Bucket name and namespace</td><td>Bucket details</td></tr>
<tr><td>Service connector OCID</td><td>Connector details</td></tr>
<tr><td>Object name prefix</td><td>Only if you set one</td></tr>
<tr><td>Compartment ID</td><td>Defaults to the tenancy OCID</td></tr>
</tbody></table>
<h3>Cloud export in Kentik</h3><ol style="padding-left:18px;margin:0 0 8px">
<li>Settings › Public Clouds › Create Cloud Export › OCI Cloud.</li>
<li>Metadata only, or Flow logs and metadata.</li>
<li>Tenancy ID, default region, and user ID for a custom user. Validate Permissions.</li>
<li>Optional compartment IDs. For flow: bucket name, namespace, connector OCID, prefix.</li>
<li>Copy the autogenerated policy, pick a billing plan, Save.</li></ol>
<p class="note">Troubleshooting: make sure the custom user is in a group, and that no policy placeholders were left in.</p>`,

INFO.kentik = {kick:'Drill-in · Kentik platform', title:'Inside Kentik SaaS',
hl:`<p class="lead">Everything lands in your own Kentik account. Kentik enriches it as it arrives, stores it in the Kentik Data Engine, and serves it to the portal, AI Advisor, alerts and APIs.</p>
<h3>What happens to your data</h3><ul>
<li><b>Ingest</b>: agents and collectors deliver flow, cloud logs, metrics, events and test results</li>
<li><b>Enrichment</b>: GeoIP, BGP routes, SNMP interface names, threat feeds and your custom dimensions are added on arrival</li>
<li><b>Storage</b>: the Kentik Data Engine keeps a separate database for each customer</li>
<li><b>Use</b>: Data Explorer, Kentik Map, NMS, Synthetics, Cloud, AI Advisor, alerts and APIs</li></ul>
<h3>Security in one line</h3><p>Hosted in the US or EU, encrypted in transit and at rest, SOC 2 Type II, and metadata only, never packet payloads.</p>`,
dd:`<h3>Hosting and availability</h3><ul>
<li>US: Ashburn, VA, at Equinix and Deft. EU: Frankfurt, chosen when you sign.</li>
<li>99.99% default uptime SLA. Status at status.kentik.com and status.kentik.eu.</li>
<li>RTO under 2 hours; RPO 24 hours for platform configuration.</li></ul>
<h3>Security</h3>
<table><thead><tr><th style="width:28%">Area</th><th>Detail</th></tr></thead><tbody>
<tr><td>In transit</td><td>TLS 1.2+ to and from kentik.com</td></tr>
<tr><td>At rest</td><td>AES-256, consistent with FIPS 140-2</td></tr>
<tr><td>Isolation</td><td>Separate logical database and tables per customer</td></tr>
<tr><td>Audits</td><td>SOC 2 Type II yearly, annual third-party pen test</td></tr>
<tr><td>Access</td><td>SAML 2.0 SSO, MFA (TOTP or hardware keys), user, admin and super admin roles, per-user API tokens</td></tr>
<tr><td>Data</td><td>IP addresses and network metadata, no packet payloads; IP redaction available</td></tr>
</tbody></table>
<h3>Default retention</h3>
<table><thead><tr><th style="width:52%">Data</th><th>Kept</th></tr></thead><tbody>
<tr><td>Full-resolution flow</td><td>45 days</td></tr>
<tr><td>Summarized data</td><td>120 days</td></tr>
<tr><td>NMS metrics</td><td>3 or 13 months by plan</td></tr>
<tr><td>Device configs</td><td>Until you delete them</td></tr>
</tbody></table>
<p class="muted" style="font-size:12.5px">Contracts can change retention.</p>
<h3>Kentik Data Engine</h3><ul>
<li>Columnar and distributed. Masters split queries into subqueries for the workers that hold each slice.</li>
<li>Each device has a Full dataseries (all records) and a Fast dataseries (a subset for queries of 24 hours or more).</li>
<li>Every slice is stored as at least two shards on different machines.</li></ul>
<h3>Getting data out</h3><ul>
<li><b>APIs</b>: per-user API tokens on api.kentik.com.</li>
<li><b>Firehose</b>: copies of enriched flow to <code>ktranslate</code>, which you run, then on to Kafka, Splunk, New Relic, HTTP, Prometheus or files. Not available for cloud flow logs from the portal.</li></ul>
<h3>Licensing</h3><p>FlowPak, NMS (DevicePak), CloudPak and Synthetics credits. Confirm entitlements with your Infoblox account team.</p>`,
src:[['Security Overview','https://kb.kentik.com/docs/security-overview'],['KDE Overview','https://kb.kentik.com/docs/kde-overview'],['Using Kentik Firehose','https://kb.kentik.com/docs/using-kentik-firehose'],['Licenses','https://kb.kentik.com/docs/licenses']]};

];
const UAC = Object.fromEntries(UACAPS.map(c => [c.id, c]));
const DRAW_ORDER = ['flow', 'snmp', 'trap', 'syslog', 'dns', 'synth', 'ssh', 'bgp'];   // order inside the agent box, matching the device lines
const DC_DEF = ['flow', 'snmp', 'trap', 'syslog'], BR_DEF = ['flow', 'snmp', 'synth'];
const BR_MAX = 10;

/* ----- Data center helpers ----- */
const isDC = v => typeof v === 'string' && /^dc[2-6]?$/.test(v);
const dcId = i => i === 1 ? 'dc' : 'dc' + i;
const dcIndex = v => v === 'dc' ? 1 : +v.slice(2);
const dcIds = () => Array.from({length:S.dcN}, (_, k) => dcId(k + 1));
function dcCustom(i){ return String(S.dcNames[i - 1] || '').trim(); }
function dcDefault(i){ return S.dcN > 1 ? 'Data center ' + i : 'Data center'; }
function dcName(i){ return dcCustom(i) || dcDefault(i); }

/* ----- Branch helpers ----- */
const isBR = v => typeof v === 'string' && /^br([1-9]|10)$/.test(v);
const brId = i => 'br' + i;
const brIndex = v => +v.slice(2);
const brIds = () => Array.from({length:S.brN}, (_, k) => brId(k + 1));
function brCustom(i){ return String(S.brNames[i - 1] || '').trim(); }
function brDefault(i){ return S.brN > 1 ? 'Branch ' + i : 'Branch office'; }
function brName(i){ return brCustom(i) || brDefault(i); }
const brUA = i => !!S.brUA[i - 1];
const dcOn = () => S.sel.has('dc');
const brOn = () => S.sel.has('branch');
function brTarget(i){ if(!dcOn()) return 0; const t = +S.brTo[i - 1] || 1; return t >= 1 && t <= S.dcN ? t : 1; }
function feeders(dc){ return brOn() ? brIds().map(brIndex).filter(i => !brUA(i) && brTarget(i) === dc) : []; }

const modOf = v => isDC(v) || v === 'dcs' ? 'dc' : isBR(v) || v === 'brs' ? 'branch' : MOD[v] ? v : null;

/* ----- Per-agent capabilities and install method ----- */
function capsOf(kind, i){
  const arr = kind === 'dc' ? S.dcCaps : S.brCaps;
  if(!arr[i - 1]) arr[i - 1] = new Set(kind === 'dc' ? DC_DEF : BR_DEF);
  return arr[i - 1];
}
/* BGP peering at a data center: off, routers peer directly with Kentik, or with the agent (BGP Proxy on) */
function bgpMode(i){ return capsOf('dc', i).has('bgp') ? 'ua' : S.dcBgp[i - 1] === 'direct' ? 'direct' : 'off'; }
function instOf(kind, i){ return (kind === 'dc' ? S.dcInst : S.brInst)[i - 1] === 'docker' ? 'docker' : 'linux'; }
const capList = (kind, i) => DRAW_ORDER.filter(c => capsOf(kind, i).has(c));
function sizing(kind, i){
  const list = capList(kind, i);
  const cpu = list.reduce((a, c) => a + UAC[c].cpu, 0), ram = list.reduce((a, c) => a + UAC[c].ram, 0);
  return {cpu, ram, rc:list.length ? Math.max(2, Math.ceil(cpu * 1.3)) : 0, rr:list.length ? Math.max(2, Math.ceil(ram * 1.3)) : 0};
}
/* Every agent that has Connectivity Test on: private test points for site-to-site tests */
function testAgents(){
  const out = [];
  if(dcOn()) for(let i = 1; i <= S.dcN; i++) if(capsOf('dc', i).has('synth')) out.push(dcName(i));
  if(brOn()) for(let i = 1; i <= S.brN; i++) if(brUA(i) && capsOf('br', i).has('synth')) out.push(brName(i));
  return out;
}
function meshMath(n){ const sub = n * (n - 1), run = sub * 2.5; return {sub, run, month:run * 43200}; }
const fmt = v => v.toLocaleString('en-US', {maximumFractionDigits:1});

function dcMod(id){
  const i = dcIndex(id), f = feeders(i).length, caps = capList('dc', i);
  return Object.assign({}, MOD.dc, {id, name:dcName(i),
    sub:f ? 'Also collects for ' + f + (f > 1 ? ' branches' : ' branch') : caps.length + ' capabilit' + (caps.length === 1 ? 'y' : 'ies') + ' on',
    subd:f ? 'Branches send across the WAN to this agent' : MOD.dc.subd,
    chips:caps.length ? caps.map(c => [c, UAC[c].chip]) : [['more', 'No capabilities on']]});
}

function brsScene(){
  const n = S.brN, ids = Array.from({length:n}, (_, k) => k + 1);
  const order = ids.filter(i => !brUA(i)).sort((a, b) => brTarget(a) - brTarget(b) || a - b).concat(ids.filter(brUA));   // grouped by the data center they send to
  const top = 58, bottom = 590, gap = 8;
  const rh = Math.min(52, Math.floor((bottom - top - (n - 1) * gap) / n));
  const frames = [{x:16, y:16, w:330, h:588, label:n > 1 ? 'Your ' + n + ' branch offices' : 'Your branch office'}];
  const nodes = [], edges = [], notes = [], pos = {};
  order.forEach((i, k) => {
    const y = top + k * (rh + gap), ua = brUA(i), t = brTarget(i), caps = ua ? capList('br', i) : [];
    pos[i] = y + rh / 2;
    nodes.push({id:'b-' + i, x:32, y, w:298, h:rh, k:ua ? 'uas' : 'net', icon:ua ? 'agent' : 'store', t:brName(i),
      s:ua ? 'Own agent · ' + caps.length + ' capabilit' + (caps.length === 1 ? 'y' : 'ies') : t ? 'No agent · sends to ' + dcName(t) : 'No agent and no data center yet',
      sd:ua ? (caps.length ? caps.map(c => UAC[c].chip).join(', ') : 'No capabilities on') : 'Flow, traps, syslog over the WAN', go:brId(i),
      i:{h:ua ? brName(i) + ' has its own Universal Agent, which sends straight to Kentik over HTTPS.' : t ? brName(i) + ' has no agent. Its devices send across the WAN to the ' + dcName(t) + ' agent.' : brName(i) + ' has no agent, and there is no data center agent to send to yet.', d:[]}});
  });
  const targets = [...new Set(order.filter(i => !brUA(i) && brTarget(i)).map(brTarget))].sort((a, b) => a - b);
  if(targets.length){
    frames.push({x:362, y:16, w:310, h:588, label:'Data center agents'});
    const remote = order.filter(i => !brUA(i));
    const yTop = top, yBot = top + remote.length * (rh + gap) - gap, dh = Math.max(rh, 46);
    const slot = (yBot - yTop) / targets.length;
    targets.forEach((t, k) => {
      const y = Math.round(yTop + slot * k + (slot - dh) / 2), caps = capList('dc', t);
      nodes.push({id:'d-' + t, x:378, y, w:278, h:dh, k:'uas', icon:'building', t:dcName(t), s:'Universal Agent · collects ' + feeders(t).length, sd:caps.length ? caps.map(c => UAC[c].chip).join(', ') : 'No capabilities on', go:dcId(t),
        i:{h:'The ' + dcName(t) + ' agent collects for the branches that point at it.', d:['Size it for its own site plus those branches.']}});
      edges.push({t:'https', a:'d-' + t, b:'kentik', p:[[656, y + dh / 2], [780, y + dh / 2]]});
      feeders(t).forEach(i => {
        const tp = capsOf('dc', t).has('flow') ? 'flow' : capsOf('dc', t).has('syslog') ? 'syslog' : capsOf('dc', t).has('trap') ? 'trap' : 'snmp';
        edges.push({t:tp, a:'b-' + i, b:'d-' + t, p:[[330, pos[i]], [378, y + dh / 2]]});
      });
    });
  }
  let first = true;
  order.filter(brUA).forEach(i => {
    edges.push(Object.assign({t:'https', a:'b-' + i, b:'kentik', p:[[330, pos[i]], [780, pos[i]]]}, first ? {lab:'Branch agents send straight to Kentik', labd:'TCP 443, outbound only', lp:[560, pos[i] - 12]} : {}));
    first = false;
  });
  nodes.push(KEN({y:58, h:532, s:'One account, every site'}));
  return {frames, nodes, edges, notes};
}

function getScene(v){
  if(isDC(v)) return agentScene('dc', dcIndex(v));
  if(isBR(v)) return brUA(brIndex(v)) ? agentScene('br', brIndex(v)) : branchRemoteScene(brIndex(v));
  if(v === 'dcs') return dcsScene();
  if(v === 'brs') return brsScene();
  return SC[v] || null;
}

const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const REDUCED = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } })();
const S = {mode:'high', sel:new Set(['dc','branch','aws']), view:'ov', focus:null, hl:null, anim:!REDUCED,
  dcN:1, dcNames:[], dcCaps:[], dcInst:[], dcBgp:[],
  brN:2, brNames:[], brUA:[], brTo:[], brCaps:[], brInst:[],
  meta:{cu:'', pb:'', rg:'US'}};
const VB = [0, 0, 1000, 620];
const FIT = [];       // texts that had to shrink to fit; empty means every label fits at its design size

function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  if(attrs) for(const k in attrs){ const v = attrs[k]; if(v !== undefined && v !== null && v !== false) e.setAttribute(k, v); }
  if(parent) parent.appendChild(e);
  return e;
}
function txt(parent, x, y, s, cls, attrs){ const t = el('text', Object.assign({x, y, class:cls}, attrs || {}), parent); t.textContent = s; return t; }
function icon(parent, name, x, y, size, cls){ return el('use', {href:'#i-' + name, x, y, width:size, height:size, class:cls || 'ico'}, parent); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));

/* Off-screen SVG for measuring text before layout */
const MS = el('svg', {width:0, height:0, 'aria-hidden':'true', style:'position:absolute;left:-9999px;top:0;visibility:hidden'});
document.body.appendChild(MS);
const MT = el('text', {x:0, y:20}, MS);
function measure(s, cls){ MT.setAttribute('class', cls); MT.textContent = s; return MT.getComputedTextLength(); }

/* Never truncate: if a label is too wide, shrink it a little and log it */
function fit(t, maxW, min){
  if(!t || !t.textContent || maxW <= 0) return t;
  let len = 0;
  try { len = t.getComputedTextLength(); } catch(e){ return t; }
  if(len > maxW + 0.5){
    const fs = parseFloat(getComputedStyle(t).fontSize) || 12;
    const ns = Math.max(min || 9, fs * maxW / len);
    t.style.fontSize = ns.toFixed(2) + 'px';
    FIT.push({text:t.textContent, len:Math.round(len), max:Math.round(maxW), size:+ns.toFixed(2), view:S.view, mode:S.mode});
  }
  return t;
}

/* Arrowheads, one per line type, kept with the icon sprite */
(function(){
  const defs = document.querySelector('#sprite defs');
  Object.keys(TYPES).forEach(t => {
    const m = el('marker', {id:'ah-' + t, viewBox:'0 0 10 10', refX:8, refY:5, markerWidth:7, markerHeight:7, orient:'auto-start-reverse', markerUnits:'userSpaceOnUse'}, defs);
    el('path', {d:'M0,0.6 L10,5 L0,9.4 z', class:'ah-' + t}, m);

/* Two points: a smooth curve (horizontal tangents, or vertical with c:'v'). More points: a polyline with rounded corners. */
function pathD(p, c){
  if(p.length === 2){
    const [a, b] = p;
    if(a[0] === b[0] || a[1] === b[1]) return `M${a[0]},${a[1]} L${b[0]},${b[1]}`;
    if(c === 'v'){ const my = (a[1] + b[1]) / 2; return `M${a[0]},${a[1]} C${a[0]},${my} ${b[0]},${my} ${b[0]},${b[1]}`; }
    const mx = (a[0] + b[0]) / 2;
    return `M${a[0]},${a[1]} C${mx},${a[1]} ${mx},${b[1]} ${b[0]},${b[1]}`;
  }
  let d = `M${p[0][0]},${p[0][1]}`;
  for(let i = 1; i < p.length - 1; i++){
    const [px, py] = p[i - 1], [x, y] = p[i], [nx, ny] = p[i + 1];
    const l1 = Math.hypot(x - px, y - py), l2 = Math.hypot(nx - x, ny - y), r = Math.min(10, l1 / 2, l2 / 2);
    const ax = x - (x - px) / l1 * r, ay = y - (y - py) / l1 * r, bx = x + (nx - x) / l2 * r, by = y + (ny - y) / l2 * r;
    d += ` L${ax.toFixed(1)},${ay.toFixed(1)} Q${x},${y} ${bx.toFixed(1)},${by.toFixed(1)}`;
  }
  const q = p[p.length - 1];
  return d + ` L${q[0]},${q[1]}`;
}

function drawEdge(gE, gL, e, idx, dd, hit){
  const g = el('g', {class:'edge e-' + e.t, 'data-edge':idx, 'data-t':e.t, 'data-a':e.a, 'data-b':e.b, 'data-bi':e.bi ? 1 : 0}, gE);
  const d = pathD(e.p, e.c);
  if(hit) el('path', {class:'hit', d}, g);
  el('path', {class:'ln', d, 'marker-end':'url(#ah-' + e.t + ')', 'marker-start':e.bi ? 'url(#ah-' + e.t + ')' : null}, g);
  const s = dd && e.labd ? e.labd : e.lab;
  if(s && e.lp){
    const lg = el('g', {class:'edge-l e-' + e.t, 'data-edge':idx}, gL);
    const inner = el('g', {class:'elab'}, lg);
    const r = el('rect', {rx:4}, inner);
    const t = txt(inner, e.lp[0], e.lp[1], s, 't-edge', {'text-anchor':e.anchor || 'middle', 'dominant-baseline':'central'});
    const b = t.getBBox();
    r.setAttribute('x', (b.x - 4).toFixed(1)); r.setAttribute('y', (b.y - 1).toFixed(1));
    r.setAttribute('width', (b.width + 8).toFixed(1)); r.setAttribute('height', (b.height + 2).toFixed(1));
  }
  return g;
}

/* Card sizes, largest first: full (with the pipeline), compact (all chips), one (first row of chips), mini (title and subtitle) */
function cardLayout(m, w, variant){
  const inner = w - 28, rows = [];
  let row = [], rw = 0;
  m.chips.forEach(c => {
    const cw = Math.ceil(measure(c[1], 'chiptxt')) + 26;
    if(row.length && rw + 6 + cw > inner){ rows.push(row); row = []; rw = 0; }
    rw += (row.length ? 6 : 0) + cw;
    row.push({t:c[0], s:c[1], w:cw});
  });
  if(row.length) rows.push(row);
  if(variant === 'mini') return {rows:[], top:62, variant, h:64};
  if(variant === 'one' && rows.length > 1){
    const first = rows[0].slice(), total = m.chips.length;
    const moreW = k => Math.ceil(measure('+' + k + ' more', 'chiptxt')) + 18;
    let used = first.reduce((a, c, i) => a + c.w + (i ? 6 : 0), 0);
    while(first.length > 1 && used + 6 + moreW(total - first.length) > inner){ const c = first.pop(); used -= c.w + 6; }
    const k = total - first.length;
    first.push({t:'more', s:'+' + k + ' more', w:moreW(k), more:true});
    return {rows:[first], top:62, variant, h:96};
  }
  const top = variant === 'full' ? 138 : 62;
  return {rows, top, variant, h:top + rows.length * 20 + (rows.length - 1) * 6 + 14};
}

/* Branch row geometry: one row, or two staggered rows so lines from the back row pass between the tiles in front */
function branchBand(rightCol){
  const brs = brIds().map(brIndex);   // branches are added from the menu at the top, not from the diagram
  const x0 = M, x1 = rightCol ? VB[2] - M - SW - 26 : VB[2] - M, rowW = x1 - x0, g = 10;
  const per = Math.max(2, Math.floor((rowW + g) / (100 + g)));
  let slots = brs.length, rows = 1, k1 = slots;
  if(slots > per){ rows = 2; k1 = Math.ceil((slots + 1) / 2); if(k1 > per){ k1 = per; slots = Math.min(slots, 2 * per - 1); } }
  const tw = Math.min(rows === 1 ? 188 : 160, (rowW - (k1 - 1) * g) / k1), th = rows === 1 ? 74 : 52;
  const top = VB[3] - M - (rows * th + (rows - 1) * 10), ox = x0 + (rowW - (k1 * tw + (k1 - 1) * g)) / 2;
  const tiles = [];
  for(let j = 0; j < slots; j++){
    const row = j < k1 ? 0 : 1, col = row ? j - k1 : j;
    tiles.push({i:j < brs.length ? brs[j] : 0, x:ox + col * (tw + g) + (row ? (tw + g) / 2 : 0), y:top + row * (th + 10), w:tw, h:th});
  }
  return {top, bus:top - 13, tiles};
}

function renderOverview(){
  const svg = $('#ov');
  svg.innerHTML = '';
  OVR = {};
  const dd = S.mode === 'deep';
  const ids = CHIP_ORDER.filter(id => S.sel.has(id) && id !== 'branch').flatMap(id => id === 'dc' ? dcIds() : [id]);
  const sideOf = id => isDC(id) ? 'left' : MOD[id].side;
  const modFor = id => isDC(id) ? dcMod(id) : MOD[id];
  const side = s => ids.filter(id => sideOf(id) === s);
  const L = side('left'), R = side('right'), T = side('top');
  const gE = el('g', {class:'edges'}, svg), gP = el('g', {class:'pts'}, svg), gN = el('g', {class:'nodes'}, svg), gL = el('g', {class:'labels'}, svg);

  const band = brOn() ? branchBand(R.length > 0) : null;
  const remote = band ? band.tiles.filter(t => t.i && !brUA(t.i) && brTarget(t.i)) : [];
  const lx = remote.length ? 46 : M;
  const column = (list, x, y0, y1) => {
    if(!list.length) return [];
    const H = y1 - y0, each = (H - (list.length - 1) * GAP) / list.length;
    const lays = list.map(id => {
      const m = modFor(id);
      for(const v of ['full', 'compact', 'one']){ const f = cardLayout(m, SW, v); if(f.h <= each) return f; }
      return cardLayout(m, SW, 'mini');
    });
    const sum = lays.reduce((a, l) => a + l.h, 0), gp = list.length > 1 ? Math.max(4, Math.min(GAP, (H - sum) / (list.length - 1))) : 0;
    let y = y0 + Math.max(0, (H - sum - (list.length - 1) * gp) / 2);
    return list.map((id, i) => { const r = {id, x, y, w:SW, h:lays[i].h, lay:lays[i]}; y += r.h + gp; return r; });
  };
  const leftBottom = band ? band.bus - 12 : VB[3] - M;
  const left = column(L, lx, M, leftBottom), right = column(R, VB[2] - M - SW, M, VB[3] - M);
  const top = T.length ? (() => { const lay = cardLayout(modFor(T[0]), CW, band ? 'compact' : 'full'); return {id:T[0], x:(VB[2] - CW) / 2, y:M, w:CW, h:lay.h, lay}; })() : null;
  const y1 = top ? top.y + top.h : 0, y2 = band ? band.bus - 4 : VB[3];
  const hub = {x:(VB[2] - HW) / 2, w:HW, h:HH, y:Math.round((y1 + y2) / 2 - HH / 2)};
  OVR.kentik = [hub.x, hub.y, hub.w, hub.h];

  const edges = [];
  const dcCards = left.filter(r => isDC(r.id)).length;
  const sideEdges = (cards, fromRight) => {
    const list = [];
    cards.forEach(r => {
      const cy = r.y + r.h / 2, two = isDC(r.id) && dcCards <= 2 && bgpMode(dcIndex(r.id)) === 'direct';   // direct BGP from the data center, when it peers with Kentik and there is room
      list.push({r, e:OV_EDGE[modOf(r.id)], y:two ? cy - 12 : cy});
      if(two) list.push({r, e:OV_BGP, y:cy + 12});
    });
    const n = list.length;
    list.forEach((it, i) => {
      const ey = n === 1 ? hub.y + hub.h / 2 : hub.y + 34 + (hub.h - 52) * i / (n - 1);
      const sx = fromRight ? it.r.x : it.r.x + it.r.w, ex = fromRight ? hub.x + hub.w : hub.x;
      const e = Object.assign({}, it.e, {a:it.r.id, b:'kentik', p:[[sx, it.y], [ex, ey]], lp:[(sx + ex) / 2, (it.y + ey) / 2]});
      if(isDC(it.r.id) && dcCards >= 4 && i !== Math.floor((n - 1) / 2)){ delete e.lab; delete e.labd; }   // one HTTPS label is enough for a stack of sites
      edges.push(e);
    });
  };
  sideEdges(left, false);
  sideEdges(right, true);
  const cx = VB[2] / 2;
  if(top) edges.push(Object.assign({}, OV_EDGE[top.id], {a:top.id, b:'kentik', c:'v', p:[[cx, top.y + top.h], [cx, hub.y]], lp:[cx, (top.y + top.h + hub.y) / 2]}));

  /* Branches: their own agent goes up to Kentik; no agent goes across the WAN to a data center agent */
  if(band){
    const own = band.tiles.filter(t => t.i && brUA(t.i));
    own.forEach((t, k) => {
      const hx = own.length === 1 ? cx : hub.x + 26 + (hub.w - 52) * k / (own.length - 1), sx = t.x + t.w / 2;
      edges.push(Object.assign({t:'https', a:brId(t.i), b:'kentik', c:'v', p:[[sx, t.y], [hx, hub.y + hub.h]]},
        k ? {} : {lab:'HTTPS', labd:'TCP 443', lp:[(sx + hx) / 2, (t.y + hub.y + hub.h) / 2]}));
    });
    const dcR = Object.fromEntries(left.filter(r => isDC(r.id)).map(r => [dcIndex(r.id), r]));
    const tgts = [...new Set(remote.map(t => brTarget(t.i)))].filter(d => dcR[d]);
    const maxCx = Math.max(...remote.map(t => t.x + t.w / 2));
    let labeled = false;
    remote.forEach(t => {
      const d = brTarget(t.i), r = dcR[d];
      if(!r) return;
      const caps = capsOf('dc', d), tp = ['flow', 'trap', 'syslog', 'snmp'].find(c => caps.has(c));
      if(!tp) return;
      const gx = lx - 10 - tgts.filter(x => x > d).length * 6, dy = r.y + r.h / 2, sx = t.x + t.w / 2;
      const e = {t:tp, a:brId(t.i), b:dcId(d), p:[[sx, t.y], [sx, band.bus], [gx, band.bus], [gx, dy], [lx, dy]]};
      if(!labeled){ Object.assign(e, {lab:'Branch telemetry over the WAN', labd:'UDP 9995 · 162 · 514 to the agent', lp:[(gx + maxCx) / 2, band.bus]}); labeled = true; }
      edges.push(e);
    });
  }
  edges.forEach((e, i) => drawEdge(gE, gL, e, i, dd, false));

  [...left, ...right, top].filter(Boolean).forEach(r => { drawCard(gN, r, modFor(r.id), dd); OVR[r.id] = [r.x, r.y, r.w, r.h]; });
  if(band){
    band.tiles.forEach(t => {
      drawBranchTile(gN, t, t.i, dd); OVR[brId(t.i)] = [t.x, t.y, t.w, t.h];
    });
    const xs = band.tiles.map(t => t.x), ys = band.tiles.map(t => t.y);
    OVR.brs = [Math.min(...xs), Math.min(...ys), Math.max(...band.tiles.map(t => t.x + t.w)) - Math.min(...xs), Math.max(...band.tiles.map(t => t.y + t.h)) - Math.min(...ys)];
  }
  const dcs = left.filter(r => isDC(r.id));
  if(dcs.length){
    const last = dcs[dcs.length - 1];
    OVR.dcs = [last.x, dcs[0].y, last.w, last.y + last.h - dcs[0].y];
  }
  drawHub(gN, hub, dd);
  if(!ids.length && !band) txt(gN, cx, hub.y + hub.h + 42, 'Pick a starting point or deployments above', 'empty-t', {'text-anchor':'middle'});
  svg._edges = edges;
}

/* ===== Lookups ===== */
function viewName(v){
  if(v === 'ov') return 'All deployments';

  if(v === 'dcs') return S.dcN > 1 ? 'All data centers' : 'Your data center';
  if(v === 'brs') return S.brN > 1 ? 'All branches' : 'Your branch';

}
function findItem(id){ const sc = SCN; if(!sc || S.view === 'ov') return null; return sc.nodes.find(n => n.id === id) || sc.frames.find(f => f.id === id) || null; }
function itemName(id){
  if(S.view === 'ov') return id === 'kentik' ? 'Kentik SaaS' : isDC(id) ? dcName(dcIndex(id)) : isBR(id) ? brName(brIndex(id)) : MOD[id] ? MOD[id].name : id;

const rectOf = it => [it.x, it.y, it.w, it.h];
const inside = (a, b) => a[0] >= b[0] - 1 && a[1] >= b[1] - 1 && a[0] + a[2] <= b[0] + b[2] + 1 && a[1] + a[3] <= b[1] + b[3] + 1;

/* ===== Highlighting ===== */
function applyHighlight(){
  const svg = S.view === 'ov' ? $('#ov') : $('#dt');
  const edges = svg._edges || [];
  let litE = null, litN = null;
  if(S.focus && S.view !== 'ov'){
    litE = new Set(); litN = new Set();
    if(S.focus.k === 'edge'){ const e = edges[S.focus.i]; if(e){ litE.add(S.focus.i); litN.add(e.a); litN.add(e.b); } }
    else {
      const id = S.focus.id;
      litN.add(id);
      edges.forEach((e, i) => { if(e.a === id || e.b === id){ litE.add(i); litN.add(e.a); litN.add(e.b); } });
    }
  } else if(S.hl){
    litE = new Set(); litN = new Set();
    edges.forEach((e, i) => { if(e.t === S.hl){ litE.add(i); litN.add(e.a); litN.add(e.b); } });
  }
  if(litN && S.view !== 'ov' && SCN){
    const lit = [...litN].map(findItem).filter(Boolean).map(rectOf);
    SCN.nodes.forEach(n => { const r = rectOf(n); if(lit.some(l => inside(r, l) || inside(l, r))) litN.add(n.id); });
  }
  svg.querySelectorAll('[data-edge]').forEach(g => g.classList.toggle('dimmed', !!litE && !litE.has(+g.dataset.edge)));
  svg.querySelectorAll('.node[data-id], .card-ov[data-go]').forEach(g => {
    const id = g.dataset.id || g.dataset.go;
    g.classList.toggle('dimmed', !!litN && !litN.has(id));
    g.classList.toggle('sel', !!S.focus && S.focus.id === id);
  });
  svg.querySelectorAll('.fnode').forEach(g => g.classList.toggle('sel', !!S.focus && S.focus.id === g.dataset.id));
  PT.list.forEach(p => p.el.classList.toggle('dimmed', p.edge.classList.contains('dimmed')));
}

/* ===== Motion: particles along the lines, one rAF loop ===== */
const PT = {list:[], raf:0};
function tick(now){
  PT.raf = requestAnimationFrame(tick);
  if(document.hidden) return;
  const s = now / 1000 * 42;
  for(const p of PT.list){
    let f = (s / p.len + p.off) % 1;
    if(p.rev) f = 1 - f;
    const q = p.path.getPointAtLength(f * p.len);
    if(p.sq){ p.el.setAttribute('x', (q.x - 2.5).toFixed(1)); p.el.setAttribute('y', (q.y - 2.5).toFixed(1)); }
    else { p.el.setAttribute('cx', q.x.toFixed(1)); p.el.setAttribute('cy', q.y.toFixed(1)); }
  }
}
function stopTick(){ if(PT.raf) cancelAnimationFrame(PT.raf); PT.raf = 0; }
function buildParticles(){
  PT.list = [];
  document.querySelectorAll('#ov g.pts, #dt g.pts').forEach(l => { l.innerHTML = ''; });
  if(!S.anim){ stopTick(); return; }
  const svg = S.view === 'ov' ? $('#ov') : $('#dt'), layer = svg.querySelector('g.pts');
  if(!layer) return;
  svg.querySelectorAll('g.edge').forEach(g => {
    const t = g.dataset.t, ty = TYPES[t];
    if(!ty || !ty.pt) return;
    const path = g.querySelector('path.ln'), len = path.getTotalLength();
    if(len < 30) return;
    const n = Math.max(1, Math.min(4, Math.round(len / 190)));
    for(let i = 0; i < n; i++){
      const shape = ty.pt === 'sq' ? el('rect', {width:5, height:5, rx:1, class:'pt-' + t}, layer) : el('circle', {r:ty.pt === 'ring' ? 3.6 : 2.7, class:'pt-' + t}, layer);
      PT.list.push({el:shape, path, len, off:i / n, rev:g.dataset.bi === '1' && i % 2 === 1, sq:ty.pt === 'sq', edge:g});
    }
  });
  if(!PT.raf) PT.raf = requestAnimationFrame(tick);
}

/* ===== Zoom between the overview and a drill-in ===== */
function aspectBox(r){
  const cx = r[0] + r[2] / 2, cy = r[1] + r[3] / 2;
  const W = Math.max(r[2] * 1.25, r[3] * 1.25 * VB[2] / VB[3]), H = W * VB[3] / VB[2];
  return [cx - W / 2, cy - H / 2, W, H];
}
function setVB(svg, b){ svg.setAttribute('viewBox', b.map(v => Math.round(v * 100) / 100).join(' ')); }
function animVB(svg, from, to, ms){
  const tok = svg._tok = (svg._tok || 0) + 1;
  if(REDUCED || !ms){ setVB(svg, to); return; }
  setVB(svg, from);
  const t0 = performance.now();
  const step = now => {
    if(svg._tok !== tok) return;
    let k = Math.min(1, (now - t0) / ms);
    k = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    setVB(svg, from.map((v, i) => v + (to[i] - v) * k));
    if(k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function show(svg, on){
  clearTimeout(svg._hide);
  svg.style.pointerEvents = on ? 'auto' : 'none';
  svg.setAttribute('aria-hidden', on ? 'false' : 'true');
  if(on){ svg.style.visibility = 'visible'; svg.style.opacity = 1; }
  else { svg.style.opacity = 0; svg._hide = setTimeout(() => { svg.style.visibility = 'hidden'; }, REDUCED ? 0 : 320); }
}
const WIDE = [-100, -62, 1200, 744];

function refresh(){ renderChrome(); renderPanel(); renderLegend(); buildParticles(); applyHighlight(); saveHash(); }

function go(view, instant){
  if(view === 'branch') view = 'br1';
  if(isBR(view) && brIndex(view) > S.brN) view = brId(S.brN);
  const mod = modOf(view);
  if(mod && !S.sel.has(mod)){ S.sel.add(mod); renderOverview(); }
  const prev = S.view, ov = $('#ov'), dt = $('#dt'), ms = instant ? 0 : 420;
  if(prev === view){ if(S.focus || S.hl){ S.focus = null; S.hl = null; refresh(); } return; }
  S.view = view; S.focus = null; S.hl = null;
  if(view === 'ov'){
    show(dt, false); animVB(dt, VB.slice(), WIDE, ms);
    show(ov, true); animVB(ov, OVR[prev] ? aspectBox(OVR[prev]) : WIDE, VB.slice(), ms);
  } else {
    renderDetail();
    if(prev === 'ov'){
      show(ov, false); animVB(ov, VB.slice(), OVR[view] ? aspectBox(OVR[view]) : VB.slice(), ms);
      show(dt, true); animVB(dt, WIDE, VB.slice(), ms);
    } else {
      setVB(dt, VB);
      if(!REDUCED && !instant){ dt.style.transition = 'none'; dt.style.opacity = 0; void dt.getBoundingClientRect(); dt.style.transition = ''; }
      show(dt, true);
    }
  }
  refresh();
  $('#panel').scrollTop = 0;
}

  S.mode = m;
  renderOverview();
  if(S.view !== 'ov') renderDetail();

/* ===== Adding, removing and renaming sites, and toggling capabilities ===== */
const siteView = v => isDC(v) || v === 'dcs' || isBR(v) || v === 'brs';
function dcRefresh(target){
  renderOverview();
  const v = S.view;
  if(siteView(v) && target && target !== v){ go(target); return; }
  if(siteView(v)){ S.focus = null; S.hl = null; renderDetail(); }
  refresh();
}
function setDCCount(n){
  const shown = Math.max(0, Math.min(DC_MAX, n)), v = S.view, sel = new Set(S.sel);
  if(shown === 0) sel.delete('dc'); else { sel.add('dc'); S.dcN = shown; }
  S.sel = sel;
  let target = v;
  if(isDC(v) || v === 'dcs'){
    if(!sel.has('dc')) target = 'ov';
    else if(isDC(v) && dcIndex(v) > S.dcN) target = dcId(S.dcN);
  }
  dcRefresh(target);
}
const stepDC = d => setDCCount((S.sel.has('dc') ? S.dcN : 0) + d);
function removeDC(i){
  if(S.dcN <= 1){ setDCCount(0); return; }

  S.brTo = S.brTo.map(t => { t = +t || 1; return t === i ? 1 : t > i ? t - 1 : t; });   // branches that pointed at the removed site move to the first one
  S.dcN--;
  dcRefresh('dcs');
}
function setBRCount(n){
  const shown = Math.max(0, Math.min(BR_MAX, n)), v = S.view, sel = new Set(S.sel);
  if(shown === 0) sel.delete('branch'); else { sel.add('branch'); S.brN = shown; }
  S.sel = sel;
  let target = v;
  if(isBR(v) || v === 'brs'){
    if(!sel.has('branch')) target = 'ov';
    else if(isBR(v) && brIndex(v) > S.brN) target = brId(S.brN);
  }
  dcRefresh(target);
}
const stepBR = d => setBRCount((S.sel.has('branch') ? S.brN : 0) + d);
function addBR(){ const was = S.sel.has('branch') ? S.brN : 0; setBRCount(was + 1); if(S.view !== 'ov' && S.brN > was) go(brId(S.brN)); }
function removeBR(i){

/* ===== URL hash keeps the current view shareable ===== */
const capCode = set => DRAW_ORDER.filter(c => set.has(c)).join('.');
function stateHash(){
  let h = 'v=' + S.view + '&m=' + S.mode + '&s=' + CHIP_ORDER.filter(id => S.sel.has(id)).join('.');
  h += '&n=' + S.dcN + '&b=' + S.brN;
  const enc = list => list.map(x => encodeURIComponent(String(x || '').trim())).join('|');
  const dn = S.dcNames.slice(0, S.dcN), bn = S.brNames.slice(0, S.brN);
  if(dn.some(x => String(x || '').trim())) h += '&dn=' + enc(dn);
  if(bn.some(x => String(x || '').trim())) h += '&bn=' + enc(bn);
  h += '&dc=' + dcIds().map((id, k) => capCode(capsOf('dc', k + 1))).join('|');
  h += '&bg=' + dcIds().map((id, k) => bgpMode(k + 1)[0]).join('');
  h += '&di=' + dcIds().map((id, k) => instOf('dc', k + 1)[0]).join('');
  h += '&bu=' + brIds().map((id, k) => brUA(k + 1) ? 1 : 0).join('');
  h += '&bt=' + brIds().map((id, k) => +S.brTo[k] || 1).join('.');
  h += '&bc=' + brIds().map((id, k) => capCode(capsOf('br', k + 1))).join('|');
  h += '&bi=' + brIds().map((id, k) => instOf('br', k + 1)[0]).join('');
  if(S.meta.cu) h += '&cu=' + encodeURIComponent(S.meta.cu);
  if(S.meta.pb) h += '&pb=' + encodeURIComponent(S.meta.pb);
  if(S.meta.rg !== 'US') h += '&rg=' + S.meta.rg;
  return h;
}
function saveHash(){ try { history.replaceState(null, '', '#' + stateHash()); } catch(e){} }
function loadHash(){
  let h = '';
  try { h = location.hash.slice(1); } catch(e){}
  if(!h && typeof window.IBK_STATE === 'string') h = window.IBK_STATE;   // a saved HTML file opens on the design it was saved with
  if(!h) return;
  const q = {}, raw = {};
  h.split('&').forEach(kv => {
    const i = kv.indexOf('=');
    if(i > 0){ const k = kv.slice(0, i), v = kv.slice(i + 1); raw[k] = v; try { q[k] = decodeURIComponent(v); } catch(e){ q[k] = v; } }
  });
  const dec = s => s.split('|').map(x => { try { return decodeURIComponent(x).slice(0, 32); } catch(e){ return ''; } });
  const caps = s => new Set(s.split('.').filter(c => UAC[c]));
  if(q.s !== undefined) S.sel = new Set(q.s.split('.').filter(id => MOD[id]));
  if(q.m === 'deep' || q.m === 'high') S.mode = q.m;
  if(q.n) S.dcN = Math.max(1, Math.min(DC_MAX, parseInt(q.n, 10) || 1));
  if(q.b) S.brN = Math.max(1, Math.min(BR_MAX, parseInt(q.b, 10) || 1));
  if(raw.dn) S.dcNames = dec(raw.dn);
  if(raw.bn) S.brNames = dec(raw.bn);
  if(q.dc !== undefined) S.dcCaps = q.dc.split('|').map(caps);
  if(q.bc !== undefined) S.brCaps = q.bc.split('|').map(caps);
  if(q.bg) S.dcBgp = [...q.bg].map(c => c === 'd' ? 'direct' : 'off');   // 'u' comes back through the bgp capability
  if(q.di) S.dcInst = [...q.di].map(c => c === 'd' ? 'docker' : 'linux');
  if(q.bi) S.brInst = [...q.bi].map(c => c === 'd' ? 'docker' : 'linux');
  if(q.bu) S.brUA = [...q.bu].map(c => c === '1');
  if(q.bt) S.brTo = q.bt.split('.').map(x => parseInt(x, 10) || 1);
  if(q.cu) S.meta.cu = q.cu.slice(0, 80);
  if(q.pb) S.meta.pb = q.pb.slice(0, 80);
  if(q.rg === 'EU') S.meta.rg = 'EU';
  const v = q.v;
  if(v === 'ov' || v === 'kentik' || v === 'dcs' || v === 'brs' || (isDC(v) ? dcIndex(v) <= S.dcN : isBR(v) ? brIndex(v) <= S.brN : !!SC[v])) S.view = v;
  const mod = modOf(S.view);
  if(mod) S.sel.add(mod);
}

/* ===== Events ===== */
$('#ov').addEventListener('click', ev => {
  const g = ev.target.closest('[data-go]');
  if(g) go(g.dataset.go);
});
$('#dt').addEventListener('click', ev => {
  const n = ev.target.closest('[data-id]');
  if(n){ setFocus(S.focus && S.focus.id === n.dataset.id ? null : {k:'node', id:n.dataset.id}); return; }
  const e = ev.target.closest('g.edge');
  if(e){ const i = +e.dataset.edge; setFocus(S.focus && S.focus.k === 'edge' && S.focus.i === i ? null : {k:'edge', i}); return; }
  if(S.focus || S.hl) setFocus(null);
});
$('#panel').addEventListener('click', ev => {
  const t = ev.target;
  if(t.closest('[data-dcadd]')){ stepDC(1); return; }
  const del = t.closest('[data-dcdel]');
  if(del){ removeDC(+del.dataset.dcdel); return; }
  const st = t.closest('[data-dcstep]');
  if(st){ stepDC(+st.dataset.dcstep); return; }
  if(t.closest('[data-bradd]')){ addBR(); return; }
  const bd = t.closest('[data-brdel]');
  if(bd){ removeBR(+bd.dataset.brdel); return; }
  const bs = t.closest('[data-brstep]');
  if(bs){ stepBR(+bs.dataset.brstep); return; }
  const cp = t.closest('[data-cap]');
  if(cp){ const [k, i, c] = cp.dataset.cap.split(':'); toggleCap(k, +i, c); return; }
  const ca = t.closest('[data-capall]');
  if(ca){ const [k, i, on] = ca.dataset.capall.split(':'); setAllCaps(k, +i, on === '1'); return; }
  const bo = t.closest('[data-bgpon]');
  if(bo){ const i = +bo.dataset.bgpon; setBgp(i, bgpMode(i) === 'off' ? 'direct' : 'off'); return; }
  const bm = t.closest('[data-bgp]');
  if(bm){ const [i, m] = bm.dataset.bgp.split(':'); setBgp(+i, m); return; }
  const ins = t.closest('[data-inst]');
  if(ins){ const [k, i, v] = ins.dataset.inst.split(':'); setInst(k, +i, v); return; }
  const bu = t.closest('[data-brua]');
  if(bu){ toggleBRUA(+bu.dataset.brua); return; }
  const g = t.closest('[data-go]');
  if(g){ go(g.dataset.go); return; }
  if(t.closest('[data-clear]')) setFocus(null);
});
$('#panel').addEventListener('input', ev => { const t = ev.target; if(t && t.classList.contains('nameIn')){ const [k, i] = t.dataset.name.split(':'); renameSite(k, +i, t.value); } });
$('#panel').addEventListener('change', ev => { const t = ev.target; if(t && t.classList.contains('toSel')) setBRTarget(+t.dataset.to, t.value); });
$('#crumbs').addEventListener('click', ev => {
  const b = ev.target.closest('[data-nav]');
  if(!b) return;
  if(b.dataset.nav === 'ov') go('ov'); else setFocus(null);
});
$('#legend').addEventListener('click', ev => {
  const b = ev.target.closest('[data-t]');
  if(!b) return;
  S.hl = S.hl === b.dataset.t ? null : b.dataset.t;
  S.focus = null;
  refresh();
});
$('#presets').addEventListener('click', ev => { const b = ev.target.closest('[data-preset]'); if(b) setSelection(new Set(PRESETS.find(p => p.id === b.dataset.preset).s)); });
$('#chips').addEventListener('click', ev => {
  const st = ev.target.closest('[data-dcstep]');
  if(st){ stepDC(+st.dataset.dcstep); return; }
  const bs = ev.target.closest('[data-brstep]');
  if(bs){ stepBR(+bs.dataset.brstep); return; }
  const b = ev.target.closest('[data-chip]');
  if(!b) return;
  const s = new Set(S.sel), id = b.dataset.chip;
  if(s.has(id)) s.delete(id); else s.add(id);
  setSelection(s);
});
$('#backBtn').addEventListener('click', () => go('ov'));
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#motionBtn').addEventListener('click', toggleMotion);
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('ib-kentik-explorer-theme', next); } catch(e){}
});
document.addEventListener('keydown', ev => {
  if(ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const tg = ev.target, k = ev.key;
  if(tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable)) return;
  if(document.querySelector('dialog[open]')) return;
  if((k === 'Enter' || k === ' ') && tg instanceof SVGElement && tg.getAttribute('role') === 'button'){
    ev.preventDefault(); tg.dispatchEvent(new MouseEvent('click', {bubbles:true})); return;
  }
  if(k === 'Escape'){ if(S.focus || S.hl) setFocus(null); else if(S.view !== 'ov') go('ov'); return; }
  if(/^[1-7]$/.test(k)){ go(CHIP_ORDER[+k - 1]); return; }
  if(k === '+' || k === '='){ stepDC(1); return; }
  if(k === '-' || k === '_'){ stepDC(-1); return; }
  if(k === 'k' || k === 'K' || k === '0'){ go('kentik'); return; }
  if(k === 'd' || k === 'D'){ setMode('deep'); return; }
  if(k === 'h' || k === 'H'){ setMode('high'); return; }
  if(k === 'm' || k === 'M'){ toggleMotion(); return; }
  if((k === 'ArrowRight' || k === 'ArrowLeft') && S.view !== 'ov'){
    const list = [];
    CHIP_ORDER.filter(id => S.sel.has(id)).forEach(id => { if(id === 'dc'){ list.push(...dcIds()); if(S.dcN > 1) list.push('dcs'); } else if(id === 'branch'){ list.push(...brIds()); if(S.brN > 1) list.push('brs'); } else list.push(id); });
    list.push('kentik');
    const i = list.indexOf(S.view);
    go(list[(i + (k === 'ArrowRight' ? 1 : list.length - 1)) % list.length]);
    ev.preventDefault();
  }
});
document.addEventListener('visibilitychange', () => { if(!document.hidden && S.anim && !PT.raf) PT.raf = requestAnimationFrame(tick); });

/* ===== Start ===== */
(function init(){
  try { const t = localStorage.getItem('ib-kentik-explorer-theme'); if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch(e){}
  buildPicker();
  loadHash();
  renderOverview();
  if(S.view === 'ov'){ show($('#ov'), true); show($('#dt'), false); }
  else { renderDetail(); show($('#dt'), true); show($('#ov'), false); }
  refresh();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
    FIT.length = 0;
    renderOverview();
    if(S.view !== 'ov') renderDetail();
    buildParticles(); applyHighlight();
  });
})();
/* ---------- Save as HTML, the deployment guide PDF, and the setup file ---------- */
const APP = !!window.IBK_APP;   // set when the page is served by the Python configurator app

function applyMeta(){
  const cu = S.meta.cu;
  $('.brand h1').textContent = cu ? 'Kentik deployment for ' + cu : 'Kentik deployment explorer';
  document.title = cu ? 'Infoblox Kentik deployment · ' + cu : 'Infoblox Kentik Deployment Explorer';
}
const slug = s => String(s || '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'design';
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* The page as it was loaded, plus the current design baked in, so the file opens exactly here */
function savedHTML(){
  const h = PRISTINE.replace(/<script id="ibk-(?:app|state)">[\s\S]*?<\/script>\n?/g, '');
  const tag = 'scr' + 'ipt';   // split so this source never matches the pattern above
  const st = '<' + tag + ' id="ibk-state">window.IBK_STATE=' + JSON.stringify(stateHash()).replace(/</g, '\\u003c') + ';<\/' + tag + '>\n';
  return h.replace('</head>', st + '</head>');
}

/* The design in the shape the Python app's deployment guide expects */
function exportCfg(){
  const sites = [];
  if(dcOn()) for(let i = 1; i <= S.dcN; i++){
    sites.push({name:dcName(i), kind:'dc', agent:true, install:instOf('dc', i), capabilities:capList('dc', i), bgp:bgpMode(i) === 'direct'});
  }
  if(brOn()) for(let i = 1; i <= S.brN; i++){
    const ua = brUA(i), t = brTarget(i);
    sites.push({name:brName(i), kind:'branch', agent:ua, install:instOf('br', i), capabilities:ua ? capList('br', i) : [], send_to:ua || !t ? '' : dcName(t), bgp:false});
  }
  const clouds = {};
  ['aws', 'azure', 'gcp', 'oci'].forEach(c => { clouds[c] = {enabled:S.sel.has(c)}; });
  return {customer:S.meta.cu || 'Example Customer', prepared_by:S.meta.pb, region:S.meta.rg, detail:S.mode, sites, clouds,
    synthetics:{enabled:S.sel.has('saas') || testAgents().length > 0, site_mesh:true, bgp_monitor:S.sel.has('saas')},
    explorer_state:stateHash()};
}

/* Draw a view off screen and turn it into a PNG. CSS variables do not resolve inside an SVG image,
   so every element gets its computed style written inline (light theme). */
const INLINE = ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'opacity', 'color',
  'font-family', 'font-size', 'font-weight'];
function inlineStyles(live, copy){
  const a = [live, ...live.querySelectorAll('*')], b = [copy, ...copy.querySelectorAll('*')];
  a.forEach((e, i) => {
    const c = b[i];
    if(!c || e.tagName !== c.tagName) return;
    if(e.closest('symbol')) return;   // icons draw with currentColor from the <use> that shows them
    const cs = getComputedStyle(e);
    c.setAttribute('style', INLINE.map(p => p + ':' + cs.getPropertyValue(p)).join(';'));
    c.removeAttribute('class');
  });
}
function svgPNG(svg, scale){
  const c = svg.cloneNode(true);
  inlineStyles(svg, c);
  c.setAttribute('xmlns', NS);
  c.setAttribute('viewBox', VB.join(' '));
  c.setAttribute('width', VB[2] * scale);
  c.setAttribute('height', VB[3] * scale);
  c.style.opacity = 1;
  c.querySelectorAll('g.pts, [data-pts]').forEach(g => { g.innerHTML = ''; });
  const liveDefs = document.querySelector('#sprite defs'), defs = liveDefs.cloneNode(true);
  inlineStyles(liveDefs, defs);
  defs.removeAttribute('style');
  const bg = document.createElementNS(NS, 'rect');
  ['x', 'y'].forEach(k => bg.setAttribute(k, 0));
  bg.setAttribute('width', VB[2]); bg.setAttribute('height', VB[3]); bg.setAttribute('fill', '#fbfbfb');
  c.insertBefore(bg, c.firstChild); c.insertBefore(defs, c.firstChild);
  const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(c));
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = VB[2] * scale; cv.height = VB[3] * scale;
      const g = cv.getContext('2d');
      g.fillStyle = '#fbfbfb'; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = () => rej(new Error('could not draw ' + (svg.getAttribute('aria-label') || 'a view')));
    img.src = src;
  });
}
function exportViews(){
  const v = [['ov', 'All deployments']];
  if(dcOn()){ dcIds().forEach((id, k) => v.push([id, dcName(k + 1)])); if(S.dcN > 1) v.push(['dcs', 'All data centers']); }
  if(brOn()){ brIds().forEach((id, k) => v.push([id, brName(k + 1)])); if(S.brN > 1) v.push(['brs', 'All branch offices']); }
  ['aws', 'azure', 'gcp', 'oci', 'saas'].filter(id => S.sel.has(id)).forEach(id => v.push([id, MOD[id].name]));
  return v;
}
async function viewImages(onStep){
  const dd = S.mode === 'deep', out = [];
  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-20000px;top:0;width:1000px;height:620px;visibility:hidden';
  const svg = el('svg', {viewBox:VB.join(' '), width:1000, height:620}, host);
  document.body.appendChild(host);
  const theme = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', 'light');   // measure and draw with the light theme
  try {
    const views = exportViews();
    for(let k = 0; k < views.length; k++){
      const [id, title] = views[k];
      if(onStep) onStep(k + 1, views.length, title);
      if(id === 'ov'){ renderOverview(); svg.innerHTML = $('#ov').innerHTML; }
      else drawScene(svg, getScene(id), dd);
      svg.querySelectorAll('.dimmed, .sel').forEach(e => e.classList.remove('dimmed', 'sel'));
      svg.querySelectorAll('g.pts').forEach(g => { g.innerHTML = ''; });
      out.push({id, title, png:await svgPNG(svg, 2)});
    }
  } finally {
    if(theme) document.documentElement.setAttribute('data-theme', theme); else document.documentElement.removeAttribute('data-theme');
    host.remove();
    renderOverview(); if(S.view !== 'ov') renderDetail(); refresh();
  }
  return out;
}

/* ===== The dialog ===== */
const XD = $('#xdlg');
function setStat(s){ $('#xStat').textContent = s; }
function openExport(){
  $('#xCu').value = S.meta.cu; $('#xPb').value = S.meta.pb; $('#xRg').value = S.meta.rg;
  $('#xJson').hidden = !APP;
  $('#xPdfNote').textContent = APP ? 'Diagrams plus install steps, sizing, firewall rules and cloud setup'
    : 'Runs in the configurator app: python3 run.py in kentik-configurator';
  $('#xPdf').disabled = !APP;
  setStat('');
  if(XD.showModal) XD.showModal(); else XD.setAttribute('open', '');
}
function readMeta(){
  S.meta.cu = $('#xCu').value.trim().slice(0, 80);
  S.meta.pb = $('#xPb').value.trim().slice(0, 80);
  S.meta.rg = $('#xRg').value === 'EU' ? 'EU' : 'US';
  applyMeta(); saveHash();
}
['xCu', 'xPb', 'xRg'].forEach(id => $('#' + id).addEventListener('change', readMeta));
$('#exportBtn').addEventListener('click', openExport);
XD.addEventListener('click', ev => { if(ev.target === XD || ev.target.closest('[data-xclose]')) XD.close(); });
$('#xHtml').addEventListener('click', () => {
  readMeta();
  download('infoblox-kentik-' + slug(S.meta.cu || 'design') + '.html', new Blob([savedHTML()], {type:'text/html'}));
  setStat('Saved. Open the file in any browser.');
});
$('#xJson').addEventListener('click', () => {
  readMeta();
  download('infoblox-kentik-setup-' + slug(S.meta.cu || 'design') + '.json', new Blob([JSON.stringify(exportCfg(), null, 2)], {type:'application/json'}));
  setStat('Saved the setup file.');
});
$('#xPdf').addEventListener('click', async () => {
  readMeta();
  const b = $('#xPdf');
  b.disabled = true;
  try {
    const images = await viewImages((k, n, t) => setStat('Drawing ' + k + ' of ' + n + ': ' + t + '…'));
    setStat('Building the PDF…');
    const r = await fetch('/api/pdf', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({cfg:exportCfg(), images})});
    if(!r.ok) throw new Error(await r.text());
    download('infoblox-kentik-deployment-guide-' + slug(S.meta.cu || 'design') + '.pdf', await r.blob());
    setStat('Saved the deployment guide.');
  } catch(e){
    setStat('Could not build the PDF: ' + e.message);
  } finally { b.disabled = false; }
});
document.addEventListener('keydown', ev => {
  if(ev.ctrlKey || ev.metaKey || ev.altKey || XD.open) return;
  const tg = ev.target;
  if(tg && (tg.tagName === 'INPUT' || tg.tagName === 'SELECT' || tg.tagName === 'TEXTAREA')) return;
  if(ev.key === 'e' || ev.key === 'E') openExport();
});
applyMeta();
